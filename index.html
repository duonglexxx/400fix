<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Proxy Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 20px;
      background: rgba(210, 153, 34, 0.15);
      color: #d29922;
      border: 1px solid rgba(210, 153, 34, 0.4);
      transition: all 0.3s ease;
    }
    .status-badge.success {
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border-color: rgba(46, 160, 67, 0.4);
    }
    .status-badge.error {
      background: rgba(248, 81, 73, 0.15);
      color: #f85149;
      border-color: rgba(248, 81, 73, 0.4);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p.desc { font-size: 13px; color: #8b949e; margin-bottom: 20px; line-height: 1.5; }
    .url-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #58a6ff;
      word-break: break-all;
      margin-bottom: 14px;
      text-align: left;
    }
    button {
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    .meta { margin-top: 16px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>
  <div class="card">
    <div id="badge" class="status-badge">
      <span class="dot"></span>
      <span id="status-text">Đang kiểm tra kết nối...</span>
    </div>

    <h1>OpenRouter Edge Proxy</h1>
    <p class="desc">Cổng trung gian định tuyến qua máy chủ Vercel, tự động tránh nút Cloudflare HKG.</p>

    <div class="url-box" id="proxy-url">Đang tải URL...</div>
    <button onclick="copyUrl()" id="copy-btn">Sao chép Proxy URL cho Janitor AI</button>

    <div class="meta" id="latency">Độ trễ: -- ms</div>
  </div>

  <script>
    const baseUrl = window.location.origin;
    // Janitor AI thường yêu cầu đường dẫn kết thúc bằng /api/v1 hoặc /api/v1/chat/completions
    const fullChatUrl = `${baseUrl}/api/v1/chat/completions`;
    document.getElementById('proxy-url').textContent = fullChatUrl;

    async function checkConnection() {
      const badge = document.getElementById('badge');
      const statusText = document.getElementById('status-text');
      const latencyText = document.getElementById('latency');
      const startTime = performance.now();

      try {
        // Gọi thử endpoint /models qua proxy của Vercel để kiểm tra đường truyền tới OpenRouter
        const response = await fetch(`${baseUrl}/api/v1/models`);
        const endTime = performance.now();
        const ping = Math.round(endTime - startTime);

        if (response.ok) {
          badge.className = 'status-badge success';
          statusText.textContent = 'Kết nối thành công tới OpenRouter';
          latencyText.textContent = `Trạng thái: HTTP ${response.status} OK • Độ trễ: ${ping} ms`;
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (err) {
        badge.className = 'status-badge error';
        statusText.textContent = 'Lỗi kết nối qua cổng trung gian';
        latencyText.textContent = `Chi tiết lỗi: ${err.message}`;
      }
    }

    function copyUrl() {
      navigator.clipboard.writeText(fullChatUrl);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Đã sao chép vào bộ nhớ tạm!';
      setTimeout(() => {
        btn.textContent = 'Sao chép Proxy URL cho Janitor AI';
      }, 2000);
    }

    checkConnection();
  </script>
</body>
</html>
